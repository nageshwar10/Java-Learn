spring:
  application:
    name: learn

  datasource:
    url: jdbc:postgresql://localhost:5432/learn
    username: learn_user
    password: learn_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
  servlet:
    context-path: /api